[project]
name = "sentinel"
version = "1.2.0"
description = "SENTINEL - Secure Communication & Digital Evidence Management (academic prototype)"
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E701", "E702", "E731", "B008", "B904", "B905"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "B011", "B017", "E501"]
"sentinel/ui/*" = ["E501"]
"sentinel/devices/*" = ["E501"]
"sentinel/services/*" = ["E501"]
"scripts/*" = ["E501", "E402"]
"main.py" = ["E501"]
